name: Build BroOS
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y nasm
      - run: |
          ls -la
          nasm -f bin boot.asm -o BroOS.img
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: BroOS-V2
          path: BroOS.img
