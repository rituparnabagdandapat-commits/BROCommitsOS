name: Build BroOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y nasm qemu-system-x86
      
      - name: Build BroOS
        run: |
          nasm -f bin boot.asm -o BroOS.img
          ls -lh
      
      - name: Upload BroOS image
        uses: actions/upload-artifact@v4
        with:
          name: BroOS-boot-image
          path: BroOS.img
