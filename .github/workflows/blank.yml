name: Build BroOS
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build
        run: |
          ls -la
          FILE=$(find. -name "*.asm" | head -n 1)
          echo "Found file: $FILE"
          if [ -z "$FILE" ]; then
            echo "No asm file! Creating dummy image"
            echo -e "No asm file found" > BroOS.img
          else
            nasm -f bin "$FILE" -o BroOS.img
          fi
          ls -lh BroOS.img
      - uses: actions/upload-artifact@v4
        with:
          name: BroOS-V2
          path: BroOS.img
